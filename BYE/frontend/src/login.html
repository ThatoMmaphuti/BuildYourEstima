<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYE | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:900px;
    height:550px;
    display:flex;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.left{
    width:50%;
    background:linear-gradient(135deg,#4A00E0,#8E2DE2);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.left h1{
    font-size:45px;
    margin-bottom:20px;
}

.left p{
    text-align:center;
    line-height:1.7;
}

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

form{
    width:80%;
}

form h2{
    margin-bottom:30px;
    color:#333;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#555;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border:1px solid #8E2DE2;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#6C2BD9;
    color:white;
    font-size:17px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#4A00E0;
}

.bottom{
    margin-top:20px;
    text-align:center;
}

.bottom a{
    text-decoration:none;
    color:#6C2BD9;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<div class="left">

<h1>BYE</h1>

<h3>Build Your Estima</h3>

<br>

<p>
Connect with people who have overcome challenges,
learn from their experiences,
and grow together.
</p>

</div>

<div class="right">

<form>

<h2>Login</h2>

<div class="input-group">
<label>Email</label>
<input type="email" placeholder="Enter Email">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" placeholder="Enter Password">
</div>

<button>Login</button>

<div class="bottom">
Don't have an account?
<a href="register.html">Register</a>
</div>

</form>

</div>

</div>

</body>
</html>
